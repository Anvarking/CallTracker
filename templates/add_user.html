{% extends "base.html" %}

{% block title %}
    Добавить пользователя — CallTracker
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <i class="bi bi-person-plus fs-1 text-primary"></i>

                    <h3 class="fw-bold mt-2">
                        Новый пользователь
                    </h3>

                    <p class="text-muted">
                        Создание учётной записи
                    </p>

                </div>


                <form method="POST">

                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label"
                        >
                            Логин
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Введите логин"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Пароль
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Введите пароль"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label
                            for="role"
                            class="form-label"
                        >
                            Роль
                        </label>

                        <select
                            id="role"
                            name="role"
                            class="form-select"
                        >

                            <option value="user">
                                User
                            </option>

                            <option value="admin">
                                Admin
                            </option>

                        </select>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary flex-grow-1"
                        >

                            <i class="bi bi-person-plus me-1"></i>

                            Создать

                        </button>


                        <a
                            href="/users"
                            class="btn btn-outline-secondary"
                        >
                            Отмена
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
