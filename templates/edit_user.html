{% extends "base.html" %}

{% block title %}
    Редактирование пользователя — CallTracker
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <i class="bi bi-person-gear fs-1 text-primary"></i>

                    <h3 class="fw-bold mt-2">
                        Редактирование
                    </h3>

                    <p class="text-muted">
                        {{ user[1] }}
                    </p>

                </div>


                <form method="POST">

                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label"
                        >
                            Логин
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            value="{{ user[1] }}"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Новый пароль
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Оставьте пустым, чтобы не менять"
                        >

                        <div class="form-text">
                            Если пароль менять не нужно —
                            оставьте поле пустым.
                        </div>

                    </div>


                    <div class="mb-4">

                        <label
                            for="role"
                            class="form-label"
                        >
                            Роль
                        </label>

                        <select
                            id="role"
                            name="role"
                            class="form-select"
                        >

                            <option
                                value="user"
                                {% if user[2] == "user" %}
                                    selected
                                {% endif %}
                            >
                                User
                            </option>

                            <option
                                value="admin"
                                {% if user[2] == "admin" %}
                                    selected
                                {% endif %}
                            >
                                Admin
                            </option>

                        </select>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary flex-grow-1"
                        >
                            <i class="bi bi-check-lg me-1"></i>
                            Сохранить
                        </button>

                        <a
                            href="/users"
                            class="btn btn-outline-secondary"
                        >
                            Отмена
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
